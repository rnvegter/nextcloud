# All state lives in folders next to this file (created by install.sh):
#   app/   Nextcloud code, config and apps   data/   user files
#   db/    PostgreSQL files                  backup/ database dumps for restic

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: nextcloud:${NEXTCLOUD_VERSION:-stable}-apache
    restart: unless-stopped
    ports:
      - "${NEXTCLOUD_BIND_IP:-0.0.0.0}:${NEXTCLOUD_PORT:-8080}:80"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_HOST_PASSWORD: ${REDIS_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      # Only read at first install; add domains later with occ config:system:set trusted_domains
      NEXTCLOUD_TRUSTED_DOMAINS: localhost ${NEXTCLOUD_DOMAIN:-}
      NEXTCLOUD_DATA_DIR: /var/www/data
      PHP_MEMORY_LIMIT: 1G
      PHP_UPLOAD_LIMIT: 16G
      # Reverse proxy (Nginx Proxy Manager in core-stack). Set on every start and
      # only when NEXTCLOUD_DOMAIN is set; empty values are ignored by the image.
      # 172.16.0.0/12 covers the Docker networks the proxy's requests come from.
      OVERWRITEPROTOCOL: ${NEXTCLOUD_DOMAIN:+https}
      OVERWRITECLIURL: ${NEXTCLOUD_DOMAIN:+https://${NEXTCLOUD_DOMAIN}}
      TRUSTED_PROXIES: ${NEXTCLOUD_DOMAIN:+172.16.0.0/12}
    volumes:
      - ./app:/var/www/html
      - ./data:/var/www/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Runs Nextcloud background jobs every 5 minutes.
  # After first start, switch to "Cron" in Settings > Administration > Basic settings.
  cron:
    image: nextcloud:${NEXTCLOUD_VERSION:-stable}-apache
    restart: unless-stopped
    entrypoint: /cron.sh
    volumes:
      - ./app:/var/www/html
      - ./data:/var/www/data
    depends_on:
      - app
